spring.application.name=ferremas
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true

transbank.commerceCode=${TRANSBANK_COMMERCE_CODE}
transbank.apiKey=${TRANSBANK_API_KEY}
transbank.integrationType=${TRANSBANK_INTEGRATION_TYPE}

bcentral.user=${BCENTRAL_USER}
bcentral.pass=${BCENTRAL_PASS}
bcentral.url=${BCENTRAL_URL}

# Mailtrap SMTP configuration
spring.mail.host=live.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=api
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=no-reply@ferremas.cl

